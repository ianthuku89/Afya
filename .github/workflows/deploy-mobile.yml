name: Deploy Mobile Apps (EAS)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_and_submit:
    name: Build & Submit via EAS
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: |
          npm install -g turbo
          npm install
        
      - name: 🚀 Build App (Android)
        run: turbo run build --filter=@healthtoken/mobile
        
      - name: 🍏 EAS Build (iOS)
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --non-interactive --auto-submit
        
      - name: 🤖 EAS Build (Android)
        working-directory: apps/mobile
        run: eas build --platform android --profile production --non-interactive --auto-submit
