# KHT Platform — CI/CD Pipeline
# Triggers: push to main, PRs to main
# Stages: lint → test → build → push → deploy
name: KHT CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/kht

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Lint + Type Check
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check — Web
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: TypeScript check — Mobile
        run: npx tsc --noEmit
        working-directory: apps/mobile

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Unit Tests
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kht
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kht_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kht"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run DB migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://kht:test_password@localhost:5432/kht_test

      - name: API tests
        run: npm test --workspace=apps/api --if-present
        env:
          DATABASE_URL: postgresql://kht:test_password@localhost:5432/kht_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Smart contract tests
        run: npx hardhat test
        working-directory: contracts
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Build & Push Docker Images
  # ──────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
            image: kht-api
          - service: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
            image: kht-web
          - service: ml
            context: ml-service
            dockerfile: ml-service/Dockerfile
            image: kht-ml
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Stage 4: Deploy to Production (K8s)
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/database.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/ml-deployment.yaml
          kubectl apply -f k8s/web-deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Rolling update — API
        run: kubectl rollout restart deployment/kht-api -n kht

      - name: Rolling update — Web
        run: kubectl rollout restart deployment/kht-web -n kht

      - name: Rolling update — ML
        run: kubectl rollout restart deployment/kht-ml -n kht

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/kht-api -n kht --timeout=120s
          kubectl rollout status deployment/kht-web -n kht --timeout=120s
          kubectl rollout status deployment/kht-ml -n kht --timeout=120s
