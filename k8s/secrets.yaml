# KHT Platform — Secrets (base64-encoded placeholders; replace at deploy time)
# In production, use External Secrets Operator → AWS Secrets Manager
apiVersion: v1
kind: Secret
metadata:
  name: kht-secrets
  namespace: kht
type: Opaque
stringData:
  DATABASE_URL: "postgresql://kht:CHANGEME@kht-postgres:5432/kht_db"
  REDIS_URL: "redis://:CHANGEME@kht-redis:6379"
  JWT_PRIVATE_KEY: "CHANGEME"
  JWT_PUBLIC_KEY: "CHANGEME"
  ENCRYPTION_KEY: "CHANGEME-at-least-32-chars-long-random-hex"
  ENCRYPTION_SALT: "kht-salt-v1"
  ML_SERVICE_KEY: "CHANGEME"
  NEXTAUTH_SECRET: "CHANGEME"
